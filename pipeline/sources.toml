# Which sources the system uses. Edit `active` to switch a source on or off.
#
#   active = true    the source is normalised, extracted, tagged and can be shown in the app
#   active = false   the source is skipped by every pipeline step, and its passages are
#                    left out when the database is loaded and at search time
#
# Turning a source off never deletes anything: its files and already-extracted
# passages stay on disk, so turning it back on needs no re-run of finished work.
# `note` is for humans only.

